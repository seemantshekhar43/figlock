[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seemantshekhar43/figlock"
publish = false

[workspace.dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "3", default-features = false, features = ["zeroize", "static_secrets"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
hkdf = "0.13"
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.4"
serde_json = "1"
hex = "0.4"
tempfile = "3"
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.11", default-features = false }
ciborium = { version = "0.2", default-features = false }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
rpassword = "7"
nix = { version = "0.31", default-features = false, features = ["socket", "user", "signal", "fs"] }
uniffi = "0.32"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"
tiny_http = { version = "0.12", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
